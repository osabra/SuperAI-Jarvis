name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_PRODUCT_ID: ${{ secrets.AMAZON_PRODUCT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "AMAZON_CLIENT_ID=${{ secrets.AMAZON_CLIENT_ID }}" >> local.properties
          echo "AMAZON_PRODUCT_ID=${{ secrets.AMAZON_PRODUCT_ID }}" >> local.properties
          gradle :app:assembleDebug --no-daemon -PGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -PAMAZON_CLIENT_ID=${{ secrets.AMAZON_CLIENT_ID }} -PAMAZON_PRODUCT_ID=${{ secrets.AMAZON_PRODUCT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
